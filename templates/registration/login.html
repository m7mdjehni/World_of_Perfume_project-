{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — World of Perfumes</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{% static 'store/css/style.css' %}">
</head>
<body class="bg-gradient-to-r from-gray-800 to-teal-600 text-white min-h-screen flex flex-col">
  <header class="header flex justify-between items-center p-5 bg-black/40">
    <a href="{% url 'store:index' %}" class="text-3xl font-bold text-white no-underline">World of Perfumes</a>
  </header>

  <main class="flex-1 flex items-center justify-center py-16">
    <div class="bg-white/10 rounded-xl p-8 w-full max-w-sm">
      <h2 class="text-2xl font-semibold text-yellow-300 mb-6 text-center">Log In</h2>

      {% if form.errors %}
        <p class="text-red-300 mb-4 text-sm text-center">Incorrect username or password. Please try again.</p>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-4">
          <label class="block mb-1 text-sm" for="id_username">Username</label>
          <input class="w-full px-3 py-2 rounded text-black" type="text" name="username" id="id_username" required autofocus>
        </div>
        <div class="mb-6">
          <label class="block mb-1 text-sm" for="id_password">Password</label>
          <input class="w-full px-3 py-2 rounded text-black" type="password" name="password" id="id_password" required>
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="w-full px-6 py-2 bg-yellow-300 text-black rounded-lg hover:bg-yellow-400 transition">
          Log In
        </button>
      </form>

      <p class="mt-6 text-sm text-center text-gray-200">
        Don't have an account?
        <a href="{% url 'store:register' %}" class="text-yellow-300 underline">Sign up</a>
      </p>
    </div>
  </main>

  <footer class="text-center py-4 bg-black/40 text-gray-300">
    &copy; 2025 World of Perfumes. All rights reserved.
  </footer>
</body>
</html>
